[package]
name = "westonite-shell-plugin"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "R1-ONLY packaging shim (deleted at R3, plan D2): the cdylib installed as desktop-shell.so. Contains just the wet_shell_init entry point (opaque pointers, no weston-sys dependency); logic lives in westonite-shell, the fence in weston."

[lib]
crate-type = ["cdylib"]

[dependencies]
weston = { workspace = true, features = ["hybrid-r1"] }
westonite-shell = { workspace = true }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
